# =====================================================================
#  Shared configuration (applies in every profile)
# =====================================================================

spring.application.name=restapi
server.port=8080

# ---------- JWT ----------
# Base64-encoded HMAC-SHA256 secret. MUST be >= 32 bytes after decoding.
# Generate a new one with:  openssl rand -base64 48
# Override in production via the JWT_SECRET environment variable.
app.security.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLXBsZWFzZS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3OA==}
app.security.jwt.expiration-ms=3600000   # 1 hour

# ---------- Jackson ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Default profile ----------
# H2 in-memory for zero-setup quick testing.
# Override via:  --spring.profiles.active=mysql   (or postgres)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}
