# =====================================================================
#  H2 profile  (default)  - in-memory database, no install required
# =====================================================================
spring.datasource.url=jdbc:h2:mem:restapidb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Web console: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:restapidb
#   User:     sa
#   Password: (blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
